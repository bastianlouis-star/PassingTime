<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passing Time</title>
<style>
  :root { --bg:#0b0d14; --fg:#d8d4c4; --dim:#7d7a70; --accent:#e0b060; --panel:#151826; --line:#2a2f45; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family: "Courier New", monospace; display:flex; justify-content:center; }
  #wrap { width:min(960px,100vw); padding:12px 16px 32px; }
  canvas { width:100%; aspect-ratio:16/9; image-rendering:pixelated; display:block; border:2px solid var(--line); background:#000; transition:filter 1s; }
  #hud { display:flex; justify-content:space-between; gap:12px; margin:10px 0 6px; font-size:14px; letter-spacing:1px; }
  #era { color:var(--accent); text-transform:uppercase; }
  #clock { color:var(--fg); text-align:right; }
  #ennui { height:6px; background:var(--panel); border:1px solid var(--line); }
  #bar { height:100%; width:0; background:#8a4a5a; transition:width .3s; }
  #ennuiLabel { font-size:11px; color:var(--dim); margin:3px 0 0; }
  #log { min-height:44px; margin:12px 0; color:var(--fg); font-style:italic; line-height:1.4; }
  #acts { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:8px; }
  button { font:inherit; color:var(--fg); background:var(--panel); border:2px solid var(--line); padding:10px 12px; text-align:left; cursor:pointer; }
  button:hover:not(:disabled) { border-color:var(--accent); }
  button:disabled { opacity:.45; cursor:default; }
  button small { display:block; color:var(--dim); margin-top:4px; font-size:11px; }
  button .fresh { height:3px; background:var(--line); margin-top:6px; }
  button .fresh i { display:block; height:100%; background:var(--accent); }
  #next { grid-column:1/-1; text-align:center; border-color:var(--accent); color:var(--accent); }
  #foot { margin-top:18px; font-size:11px; color:var(--dim); display:flex; justify-content:space-between; }
  #foot a { color:var(--dim); cursor:pointer; text-decoration:underline; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="320" height="180"></canvas>
  <div id="hud"><div id="era"></div><div id="clock"></div></div>
  <div id="ennui"><div id="bar"></div></div>
  <div id="ennuiLabel">ennui</div>
  <p id="log"></p>
  <div id="acts"></div>
  <div id="foot"><span>Hold SPACE to let time flow faster.</span><a id="reset">start over</a></div>
</div>
<script src="game.js"></script>
</body>
</html>
